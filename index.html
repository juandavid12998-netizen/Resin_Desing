<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Resina</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        label { font-weight: bold; color: #555; display: block; margin-top: 10px; }
        input, button { width: 100%; padding: 12px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { background: #2ecc71; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; }
        button:hover { background: #27ae60; }
        #resultado { margin-top: 20px; background: #e8f8f5; padding: 15px; border-radius: 5px; border-left: 5px solid #2ecc71; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Calculadora de Resina (2:1)</h2>
        
        <label>Peso de 1 pieza (g o ml):</label>
        <input type="number" id="peso" step="any" placeholder="Ej: 2.25">
        
        <label>Cantidad de moldes:</label>
        <input type="number" id="moldes" placeholder="Ej: 10">
        
        <label>Margen de desperdicio (%):</label>
        <input type="number" id="margen" value="5">
        
        <button onclick="calcular()">Calcular Materiales</button>
        
        <div id="resultado">
            <p style="text-align: center; color: #777; margin: 0;">Ingresa los datos para ver el cálculo.</p>
        </div>
    </div>

    <script>
        function calcular() {
            let peso = parseFloat(document.getElementById('peso').value);
            let moldes = parseInt(document.getElementById('moldes').value);
            let margenInput = document.getElementById('margen').value;
            let margen = margenInput === "" ? 0 : parseFloat(margenInput) / 100;

            if (isNaN(peso) || isNaN(moldes) || peso <= 0 || moldes <= 0) {
                document.getElementById('resultado').innerHTML = "<p style='color:red; margin:0;'>Por favor ingresa valores válidos mayores a cero.</p>";
                return;
            }

            let resinaTotal = (peso / 3.0) * 2.0 * moldes;
            let endurecedorTotal = (peso / 3.0) * 1.0 * moldes;

            let resinaFinal = resinaTotal * (1 + margen);
            let endurecedorFinal = endurecedorTotal * (1 + margen);
            let totalMezcla = resinaFinal + endurecedorFinal;

            document.getElementById('resultado').innerHTML = `
                <h3 style="margin-top:0; color:#2c3e50;">Resultados:</h3>
                <p><b>Resina (Parte A):</b> ${resinaFinal.toFixed(2)} g/ml</p>
                <p><b>Endurecedor (Parte B):</b> ${endurecedorFinal.toFixed(2)} g/ml</p>
                <hr style="border:0; border-top:1px solid #b2dfdb;">
                <p style="font-size: 1.1em; color: #16a085;"><b>Mezcla Total:</b> ${totalMezcla.toFixed(2)} g/ml</p>
            `;
        }
    </script>
</body>
</html>
